# The providers Atlas knows out of the box, all reached through the official OpenAI SDK.
#
# A user adds a provider, or changes a field of one of these, in ATLAS_HOME/models.toml under the
# same [providers.<id>] table. The fields:
#
#   name                shown to the user
#   base_url            the OpenAI-compatible address
#   key                 the vault secret that holds the API key; absent for a local server
#   wire                "chat" (Chat Completions) or "responses" (OpenAI's Responses API)
#   catalog             the models.dev provider whose capability and price data apply
#   replay              provider fields this provider takes back on the next call; a strict
#                       provider refuses a request that carries one it does not know
#   effort              how Chat Completions sends the effort: "reasoning_effort" (OpenAI's
#                       field), "reasoning" (OpenRouter's {"effort": ...} object) or
#                       "thinking_level" (Gemini's, inside its thinking_config)
#   trailing_assistant  whether a request may end with an assistant message
#   free                a server on the user's machine: every call costs zero, and the zero is known
#   key_check           the path, under base_url, that answers only to a valid key and spends nothing
#   key_page            the page where the user makes a key, which the key screen links to
#   default_model       the model used when the settings name none. A dated choice, so it lives here
#   models              the models the app's picker offers, in order: a dated choice too; the
#                       user's models.toml adds to it
#   ask_reasoning       body fields that ask a model that reasons for its readable reasoning
#   tool_search         model ids, or their beginnings, that search deferred tools with the
#                       provider's own tool search (Responses API only)
#   cache_write_long    the write to a cache that lasts an hour, as a multiple of the input price,
#                       where the catalog prices only the short one
#   max_output          the most output a call asks for, below the model's own limit

[providers.openai]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
key = "OPENAI_API_KEY"
key_page = "https://platform.openai.com/api-keys"
# Since GPT-5.4, Chat Completions refuses function tools together with reasoning (HTTP 400, "use
# /v1/responses or set reasoning_effort to 'none'"). The Responses API takes both.
wire = "responses"
catalog = "openai"
# "Only gpt-5.4 and later models support tool_search" (platform guide, Tool search). The tools it
# finds come back at the end of the context, so the cache holds.
tool_search = ["gpt-5.4", "gpt-5.5", "gpt-5.6", "gpt-6"]
default_model = "gpt-6-luna"
models = ["gpt-6-luna", "gpt-6-sol", "gpt-6.1-sol"]

[providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
key = "OPENROUTER_API_KEY"
key_page = "https://openrouter.ai/keys"
wire = "chat"
catalog = "openrouter"
# reasoning_details must come back unchanged so the model can continue its reasoning across tool
# calls; extra_content carries the thought signature of Gemini models served through OpenRouter.
replay = ["reasoning_details", "extra_content"]
effort = "reasoning"
# Its /models answers without a key; /key answers only to a valid one.
key_check = "/key"
default_model = "openai/gpt-6-luna"
models = [
    "anthropic/claude-fable-5.1", "anthropic/claude-opus-5.5", "anthropic/claude-sonnet-5.5",
    "anthropic/claude-haiku-5.5", "openai/gpt-6.1-sol", "openai/gpt-6-sol", "openai/gpt-6-luna",
    "google/gemini-3.1-pro-preview", "google/gemini-3.8-flash", "x-ai/grok-4.7",
    "deepseek/deepseek-v4-pro", "moonshotai/kimi-k3", "z-ai/glm-5.3",
]

[providers.gemini]
name = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key = "GEMINI_API_KEY"
key_page = "https://aistudio.google.com/app/apikey"
wire = "chat"
catalog = "google"
# Gemini 3 refuses (HTTP 400) a history whose tool calls lost their thought signature, found in
# tool_calls[].extra_content.google.thought_signature.
replay = ["extra_content"]
# "Requests ending with a model turn are not supported" (HTTP 400), seen by Atlas V3 on 07/10/2026.
trailing_assistant = false
# Gemini sends its readable reasoning only when asked, and then at the start of the text between
# <thought> tags (seen on 08/10/2026), which the chat reader takes out as it takes out every
# reasoning tag. In the JSON the field is literally named extra_body.
ask_reasoning = { extra_body = { google = { thinking_config = { include_thoughts = true } } } }
# The effort goes inside that same thinking_config: Gemini refuses reasoning_effort beside it.
effort = "thinking_level"
default_model = "gemini-3.8-flash"
models = [
    "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.1-pro-preview", "gemini-3.6-flash",
    "gemini-3.1-flash-lite-preview",
]

[providers.anthropic]
name = "Anthropic"
# The SDK appends /v1/messages; the key check is its own models list (/v1/models), which answers
# only to a valid key and spends nothing.
base_url = "https://api.anthropic.com"
key = "ANTHROPIC_API_KEY"
key_page = "https://platform.claude.com/settings/keys"
# Its own wire, on its own SDK (step 3b): the cache only where a request marks it, and the
# reasoning kept only while everything before it is unchanged.
wire = "messages"
catalog = "anthropic"
# The thinking blocks, with their signatures, go back only to the model that wrote them.
replay = ["content"]
# "Requests ending with an assistant message (prefill) are not supported" on these models.
trailing_assistant = false
# Its pricing page: a write to the one-hour cache costs 2x the input (the five-minute one, 1.25x,
# is the cache_write models.dev gives).
cache_write_long = 2
# The most output a call asks for: 32,000 for a model not listed otherwise. On 14/10/2026
# one Opus 5.5 call reasoned in a loop to the model's 128,000 and cost US$ 2.68. Raise it in
# models.toml ([providers.anthropic] max_output), up to the model's own limit.
max_output = 32000
default_model = "claude-opus-5-5"
models = ["claude-opus-5-5", "claude-fable-5-1", "claude-sonnet-5-5", "claude-haiku-5-5"]

[providers.ollama]
name = "Ollama"
base_url = "http://localhost:11434/v1"
wire = "chat"
free = true

[providers.vllm]
name = "vLLM"
base_url = "http://localhost:8000/v1"
wire = "chat"
free = true
